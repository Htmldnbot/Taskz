name: Taskz Android CI Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit & Robolectric Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Configure placeholder secrets for compilation
        shell: bash
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || printf 'SUPABASE_URL=https://placeholder.supabase.co\nSUPABASE_ANON_KEY=placeholder\n' > .env
          fi

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Run JVM & Robolectric unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
