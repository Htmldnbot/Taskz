name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore permanent signing keystore
        id: keystore
        env:
          TASKZ_KEYSTORE_BASE64: ${{ secrets.TASKZ_KEYSTORE_BASE64 }}
          TASKZ_KEYSTORE_PASSWORD: ${{ secrets.TASKZ_KEYSTORE_PASSWORD }}
          TASKZ_KEY_ALIAS: ${{ secrets.TASKZ_KEY_ALIAS }}
          TASKZ_KEY_PASSWORD: ${{ secrets.TASKZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for var in TASKZ_KEYSTORE_BASE64 TASKZ_KEYSTORE_PASSWORD TASKZ_KEY_ALIAS TASKZ_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required GitHub secret: $var"
              echo "Configure all four secrets in Repository Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/taskz-signing.jks"

          printf '%s' "$TASKZ_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$TASKZ_KEYSTORE_PASSWORD" \
            -alias "$TASKZ_KEY_ALIAS" >/dev/null

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed Debug APK
        env:
          TASKZ_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          TASKZ_KEYSTORE_PASSWORD: ${{ secrets.TASKZ_KEYSTORE_PASSWORD }}
          TASKZ_KEY_ALIAS: ${{ secrets.TASKZ_KEY_ALIAS }}
          TASKZ_KEY_PASSWORD: ${{ secrets.TASKZ_KEY_PASSWORD }}
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK signature and metadata
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found: $APK_PATH"
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android build-tools not found."
            exit 1
          fi

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          if [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found."
            exit 1
          fi

          echo "Checking APK signature..."

          if ! VERIFY_OUT="$("$APKSIGNER" verify --print-certs --verbose "$APK_PATH")"; then
            echo "::error::APK signature verification failed."
            exit 1
          fi

          echo "APK signature verification passed."

          echo "Reading APK metadata..."

          if ! BADGING_OUTPUT="$("$AAPT2" dump badging "$APK_PATH")"; then
            echo "::error::Could not read APK metadata."
            exit 1
          fi

          BADGING_LINE="$(printf '%s\n' "$BADGING_OUTPUT" | sed -n '1p')"

          PKG_NAME="$(printf '%s' "$BADGING_LINE" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"

          VER_CODE="$(printf '%s' "$BADGING_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"

          VER_NAME="$(printf '%s' "$BADGING_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          RAW_SHA1="$(printf '%s\n' "$VERIFY_OUT" | sed -n '/Signer #1 certificate SHA-1 digest:/s/.*digest: *//p' | sed -n '1p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"

          RAW_SHA256="$(printf '%s\n' "$VERIFY_OUT" | sed -n '/Signer #1 certificate SHA-256 digest:/s/.*digest: *//p' | sed -n '1p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"

          if [ -z "$PKG_NAME" ]; then
            echo "::error::Could not read package name."
            echo "$BADGING_LINE"
            exit 1
          fi

          if [ "$PKG_NAME" != "com.taskz.app" ]; then
            echo "::error::Unexpected package name: $PKG_NAME"
            exit 1
          fi

          if [ -z "$RAW_SHA1" ] || [ -z "$RAW_SHA256" ]; then
            echo "::error::Could not extract signing fingerprints."
            echo "Full apksigner output:"
            printf '%s\n' "$VERIFY_OUT"
            exit 1
          fi

          FMT_SHA1="$(printf '%s' "$RAW_SHA1" | sed 's/\(..\)/\1:/g; s/:$//')"

          FMT_SHA256="$(printf '%s' "$RAW_SHA256" | sed 's/\(..\)/\1:/g; s/:$//')"

          echo ""
          echo "=========================================="
          echo "       TASKZ APK VERIFICATION"
          echo "=========================================="
          echo "Package name   : $PKG_NAME"
          echo "Version code   : $VER_CODE"
          echo "Version name   : $VER_NAME"
          echo "SHA-1          : $FMT_SHA1"
          echo "SHA-256        : $FMT_SHA256"
          echo "Signature      : VERIFIED"
          echo "=========================================="

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/taskz-signing.jks"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
