name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Taskz APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Restore permanent signing key
      - name: Restore permanent signing keystore
        id: keystore
        shell: bash
        env:
          TASKZ_KEYSTORE_BASE64: ${{ secrets.TASKZ_KEYSTORE_BASE64 }}
          TASKZ_KEYSTORE_PASSWORD: ${{ secrets.TASKZ_KEYSTORE_PASSWORD }}
          TASKZ_KEY_ALIAS: ${{ secrets.TASKZ_KEY_ALIAS }}
          TASKZ_KEY_PASSWORD: ${{ secrets.TASKZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for var in \
            TASKZ_KEYSTORE_BASE64 \
            TASKZ_KEYSTORE_PASSWORD \
            TASKZ_KEY_ALIAS \
            TASKZ_KEY_PASSWORD
          do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing GitHub secret: $var"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/taskz-signing.jks"

          printf '%s' "$TASKZ_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$TASKZ_KEYSTORE_PASSWORD" \
            -alias "$TASKZ_KEY_ALIAS" >/dev/null

          echo "Permanent keystore validated."

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      # 4. Gradle permission
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 5. Build APK
      - name: Build signed Debug APK
        shell: bash
        env:
          TASKZ_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          TASKZ_KEYSTORE_PASSWORD: ${{ secrets.TASKZ_KEYSTORE_PASSWORD }}
          TASKZ_KEY_ALIAS: ${{ secrets.TASKZ_KEY_ALIAS }}
          TASKZ_KEY_PASSWORD: ${{ secrets.TASKZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Starting Taskz APK build..."

          ./gradlew clean assembleDebug --stacktrace

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK build failed. APK file not found."
            exit 1
          fi

          echo "APK successfully generated."

      # 6. Upload APK immediately after successful build
      - name: Upload Taskz APK
        uses: actions/upload-artifact@v4
        with:
          name: Taskz-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 7. Verify APK
      - name: Verify APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          BUILD_TOOLS_DIR="$(
            find "$SDK_ROOT/build-tools" \
              -mindepth 1 -maxdepth 1 -type d \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android build tools not found."
            exit 1
          fi

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"

          echo "Verifying APK signature..."

          VERIFY_OUT="$(
            "$APKSIGNER" verify --print-certs --verbose "$APK_PATH"
          )"

          echo "Signature verification passed."

          echo "Reading APK package information..."

          BADGING_OUTPUT="$("$AAPT2" dump badging "$APK_PATH")"

          BADGING_LINE="$(
            printf '%s\n' "$BADGING_OUTPUT" \
              | sed -n '/^package:/p' \
              | sed -n '1p'
          )"

          if [ -z "$BADGING_LINE" ]; then
            echo "::error::APK package information not found."
            exit 1
          fi

          # Package name
          PKG_NAME="$(
            printf '%s\n' "$BADGING_LINE" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          # Version code
          VER_CODE="$(
            printf '%s\n' "$BADGING_LINE" \
              | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p"
          )"

          # Version name
          VER_NAME="$(
            printf '%s\n' "$BADGING_LINE" \
              | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p"
          )"

          # SHA-1: supports V2 Signer and Signer #1 formats
          RAW_SHA1="$(
            printf '%s\n' "$VERIFY_OUT" \
              | sed -n 's/.*certificate SHA-1 digest: *//p' \
              | sed -n '1p' \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )"

          # SHA-256
          RAW_SHA256="$(
            printf '%s\n' "$VERIFY_OUT" \
              | sed -n 's/.*certificate SHA-256 digest: *//p' \
              | sed -n '1p' \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )"

          # Validate package
          if [ "$PKG_NAME" != "com.taskz.app" ]; then
            echo "::error::Unexpected package name: $PKG_NAME"
            exit 1
          fi

          # Validate versions
          if [ -z "$VER_CODE" ] || [ -z "$VER_NAME" ]; then
            echo "::error::APK version information missing."
            exit 1
          fi

          # Validate fingerprints
          if [[ ! "$RAW_SHA1" =~ ^[A-F0-9]{40}$ ]]; then
            echo "::error::Invalid SHA-1 fingerprint."
            printf '%s\n' "$VERIFY_OUT"
            exit 1
          fi

          if [[ ! "$RAW_SHA256" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::Invalid SHA-256 fingerprint."
            printf '%s\n' "$VERIFY_OUT"
            exit 1
          fi

          # Format fingerprints
          FMT_SHA1="$(
            printf '%s' "$RAW_SHA1" \
              | sed 's/../&:/g; s/:$//'
          )"

          FMT_SHA256="$(
            printf '%s' "$RAW_SHA256" \
              | sed 's/../&:/g; s/:$//'
          )"

          echo ""
          echo "=========================================="
          echo "          TASKZ APK VERIFIED"
          echo "=========================================="
          echo "Package name : $PKG_NAME"
          echo "Version code : $VER_CODE"
          echo "Version name : $VER_NAME"
          echo "SHA-1        : $FMT_SHA1"
          echo "SHA-256      : $FMT_SHA256"
          echo "Signature    : VERIFIED"
          echo "=========================================="

          # Confirm expected permanent signing certificate
          EXPECTED_SHA1="D7FCD7715FD40FDC8B55E916E467C60FC064E2A6"

          if [ "$RAW_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK is not signed with the expected permanent key."
            exit 1
          fi

          echo "Permanent signing key confirmed."

      # 8. Cleanup
      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/taskz-signing.jks"
