name: Deploy Supabase Edge Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-functions:
    name: Deploy Edge Functions & Sync Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required Supabase deployment secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing GitHub secret: SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Sync Edge Function secrets (when provided)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${PUSH_WEBHOOK_SECRET:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" PUSH_WEBHOOK_SECRET="$PUSH_WEBHOOK_SECRET"
            echo "Synced PUSH_WEBHOOK_SECRET."
          else
            echo "::warning::PUSH_WEBHOOK_SECRET not set in GitHub Secrets; configure it in Supabase Dashboard if not already set."
          fi

          if [ -n "${FCM_SERVICE_ACCOUNT_JSON:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" FCM_SERVICE_ACCOUNT_JSON="$FCM_SERVICE_ACCOUNT_JSON"
            echo "Synced FCM_SERVICE_ACCOUNT_JSON."
          else
            echo "::warning::FCM_SERVICE_ACCOUNT_JSON not set in GitHub Secrets; configure it in Supabase Dashboard for FCM push delivery."
          fi

      - name: Deploy all Taskz Edge Functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for fn in employee-login admin-reset-password send-push-notification; do
            echo "Deploying Edge Function: $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done
          echo "All Edge Functions deployed successfully."
